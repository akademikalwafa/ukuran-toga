<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toga Ceria — Konfirmasi Ukuran Baju Toga</title><meta name="theme-color" content="#1d4ed8">
<link rel="preconnect" href="https://script.google.com"><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="toast"></div><div id="modal" class="mo"></div>

<main id="S" class="s">
  <section class="v on" id="v-home"></section>
  <section class="v" id="v-form"></section>
  <section class="v" id="v-status"></section>
  <nav class="bn" id="bn">
    <button data-n="home">🏠<span>Beranda</span></button><button data-n="form">📏<span>Pilih Ukuran</span></button>
    <button data-n="guide">📖<span>Panduan</span></button><button data-n="status">🧾<span>Bukti</span></button>
  </nav>
</main>

<main id="A" class="a" hidden>
  <section id="a-login" class="al"><form class="card" id="alf">
    <h2>🎓 Toga Ceria — Panitia</h2><small>Login Admin</small>
    <label>Username<input name="u" autocomplete="username" required></label>
    <label>Password<input name="p" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="alb">Masuk</button></form></section>
  <div id="a-app" hidden>
    <header class="ah"><b>🎓 Toga Ceria</b>
      <nav><button class="tb on" data-t="dash">📊 Dashboard</button><button class="tb" data-t="mhs">👥 Mahasiswa</button><button class="tb" data-t="cfg">⚙️ Pengaturan</button></nav>
      <button class="btn sm ghost" data-a="sync">⟳ Sync</button><button class="btn sm" data-a="csv">⬇ Excel</button><button class="btn sm red" data-a="logout">Keluar</button></header>
    <div class="ac">
      <section class="av on" id="a-dash"></section><section class="av" id="a-mhs"></section><section class="av" id="a-cfg"></section>
    </div>
  </div>
</main>

<script src="js/config.js"></script><script src="js/app.js"></script>
</body></html>
